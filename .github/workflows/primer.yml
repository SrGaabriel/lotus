name: Build & Deploy Primer

on:
  push:
    branches: [main, ci]
    paths:
      - "docs/**"
      - ".github/workflows/primer.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5

      - name: Compile primer
        run: |
          mkdir -p _site
          typst compile docs/primer.typ _site/primer.pdf

      - name: Write index redirect
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <title>Lotus Primer</title>
          <meta http-equiv="refresh" content="0; url=primer.pdf">
          <link rel="canonical" href="primer.pdf">
          <p><a href="primer.pdf">Open the Lotus primer (PDF)</a>.</p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
