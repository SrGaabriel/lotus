[workspace]
resolver = "2"
members = ["crates/driver", "crates/lotus", "crates/syntax"]
default-members = ["crates/lotus"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/SrGaabriel/leander"
authors = ["Gabriel"]

[workspace.dependencies]
clap = { version = "^4.6", features = ["derive"] }
cstree = { version = "^0.14", features = ["derive", "serialize", "lasso", "multi_threaded_interning"] }
salsa = { version = "^0.26" }
anyhow = "1"
thiserror = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
